<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="theme-color" content="#A2FADA">
    <title>Winston Engamba | Project Resource</title>

    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
    <link rel="alternate icon" type="image/png" href="assets/icons/favicon-32.png">
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/cases.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="viewer-page">
    <header class="viewer-header">
        <div class="container viewer-header-inner">
            <div>
                <span class="section-label">Project resource</span>
                <h1 class="viewer-heading" data-viewer-title>Loading preview…</h1>
            </div>
            <button type="button" class="button button-secondary" data-close-viewer>Close preview</button>
        </div>
    </header>

    <main class="viewer-main">
        <div class="container">
            <p class="viewer-notice">Read-only presentation with print and common save actions disabled.</p>
            <div class="viewer-frame" data-viewer-frame aria-live="polite"></div>
        </div>
    </main>

    <div class="capture-shield" aria-hidden="true">
        <p>This preview is hidden while the page is inactive.</p>
    </div>

    <script src="js/document-viewer.js" defer></script>
</body>
</html>
